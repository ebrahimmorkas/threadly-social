services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadly
      POSTGRES_PASSWORD: threadly
      POSTGRES_DB: threadly
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is optional. Start it with: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6380:6379"

volumes:
  postgres-data:
